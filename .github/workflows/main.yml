name: CI
on: [push]
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: ⚒ Install deps
        run: bun install

      - name: 🔎 Lint
        run: bun lint

      - name: 🔎 Lint CSS
        run: bun lint:css

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: ⚒ Install deps
        run: bun install

      - name: 🧪 Test
        run: bun test:ci

      - name: 📖 Storybook coverage
        run: bun run check:storybook

      - name: ♿ Storybook a11y
        run: bun run test:a11y:ci
